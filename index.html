<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מתא אב לזרע</title>
<style>
:root{
  --bg:#FFF8F1; --ink:#1D2133; --muted:#4A5068; --card:#FFFFFF; --line:#E7E0F3;
  --pri:#4A3DA6; --pri2:#372C88; --priSoft:#EEEBFB;
  --acc:#FFB300; --accSoft:#FFF4CC; --accInk:#5E4300;
  --mBody:#F9C6DA; --mStroke:#B0185C; --mBand:#D6246E; --mInk:#8A0F49; --mSoft:#FDE9F1;
  --pBody:#BFE6FA; --pStroke:#0A6FB0; --pBand:#1690D6; --pInk:#064C7A; --pSoft:#E6F5FD;
  --ok:#17663F; --okBg:#E2F5EA; --bad:#A3231B; --badBg:#FDECEA;
  --mint:#CDF2DF; --mintS:#2A8F60;
  --r:18px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Rubik","Assistant","Heebo","Segoe UI","Arial Hebrew","Noto Sans Hebrew",Arial,sans-serif;
  font-size:17px;line-height:1.6;
  background-image:radial-gradient(#F1E6DA 1.2px,transparent 1.2px);background-size:22px 22px;}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.25;margin:0 0 .4em}
p{margin:.3em 0 .7em}
.wrap{max-width:980px;margin:0 auto;padding:0 14px 60px}

/* top bar */
.topbar{background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:5}
.topbar .in{max-width:980px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;color:var(--pri2);font-size:17px;white-space:nowrap}
.steps{display:flex;gap:4px;flex:1;min-width:0;overflow:hidden}
.step{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--muted);padding:2px 0 0;border-top:5px solid #E3DDEF;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.done{border-top-color:#9C90DA;color:var(--pri2)}
button.step{background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer;font-family:inherit;text-decoration:underline;text-underline-offset:3px}
button.step:hover{color:var(--pri)}
.step.cur{border-top-color:var(--pri);color:var(--pri2);font-weight:700}

/* cards & buttons */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0;box-shadow:0 2px 0 rgba(74,61,166,.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border-radius:14px;border:2px solid var(--pri);background:#fff;color:var(--pri2);font-weight:700;cursor:pointer;text-align:center;transition:transform .12s, background .12s}
.btn:hover{background:var(--priSoft)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--pri);color:#fff}
.btn.primary:hover{background:var(--pri2)}
.btn.big{font-size:19px;min-height:58px;padding:12px 28px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.wa{text-decoration:none;background:#127C4A;border-color:#127C4A;color:#fff}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.navRow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
.muted{color:var(--muted)}
.small{font-size:14px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--priSoft);color:var(--pri2);font-weight:700;font-size:14px;white-space:nowrap}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.count{background:#F6F3FF;border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:15px}
.count b{font-size:22px;color:var(--pri2);margin-inline-end:4px}
.tagM,.tagP{display:inline-block;border-radius:8px;padding:0 7px;font-weight:700;font-size:14px;white-space:nowrap}
.tagM{background:var(--mSoft);color:var(--mInk);border:1px solid #F3B5CD}
.tagP{background:var(--pSoft);color:var(--pInk);border:1px solid #A9D9F3}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:4px;vertical-align:middle}
.dot.M{background:var(--mBand)} .dot.P{background:var(--pBand)}
.mk{white-space:nowrap}
.mk.M{color:var(--mInk)} .mk.P{color:var(--pInk)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;margin:4px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{display:inline-block;width:22px;height:12px;border-radius:6px;border:1.5px solid}
.sw.M{background:var(--mBody);border-color:var(--mStroke)} .sw.P{background:var(--pBody);border-color:var(--pStroke)}
.sw.hl{background:#fff;border:3px solid var(--acc)}

/* mascot */
.mascot{display:flex;gap:12px;align-items:flex-end;margin:16px 0 6px}
.mascot svg{width:86px;height:86px;flex:none}
.bubble{position:relative;background:#fff;border:2px solid var(--mintS);border-radius:18px;padding:10px 14px;font-size:16px;flex:1}
.bubble:after{content:"";position:absolute;bottom:14px;right:-11px;width:16px;height:16px;background:#fff;border-right:2px solid var(--mintS);border-bottom:2px solid var(--mintS);transform:rotate(-45deg)}

/* opening */
.hero{text-align:center;padding:26px 16px 18px;background:linear-gradient(180deg,#F1EDFF 0%,#fff 70%)}
.hero h1{font-size:44px;color:var(--pri2);letter-spacing:-.5px;margin:4px 0}
.credit{font-weight:700;color:var(--muted)}
.heroArt{max-width:520px;margin:10px auto 0}
.note{background:var(--accSoft);border:1px solid #F1D88A;border-radius:14px;padding:12px 14px;color:#3D2F00}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.mpair{background:#FBFAFF;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.mph{font-weight:800;color:var(--pri2);margin-bottom:4px}
.mpl{margin:3px 0;font-size:15.5px}
.model{width:100%;border-collapse:separate;border-spacing:0 6px}
.model th{font-size:14px;color:var(--muted);text-align:right;font-weight:700;padding:0 6px}
.model td{padding:8px;vertical-align:top;background:#FBFAFF}
.model td:first-child{border-radius:0 10px 10px 0;font-weight:700;white-space:nowrap}
.model td:last-child{border-radius:10px 0 0 10px}

/* sim */
.sticky{position:sticky;top:0;z-index:4;background:rgba(255,248,241,.97);backdrop-filter:blur(4px);padding:10px 0 8px;margin:0 -14px;padding-inline:14px;border-bottom:1px solid var(--line)}
.simBtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.simBtn{min-height:62px;flex-direction:column;gap:0;padding:6px 8px;line-height:1.25}
.simBtn .c{font-size:13px;font-weight:600;opacity:.9}
.simBtn.met .c:after{content:" ✓"}
.status{margin-top:8px;font-size:15px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px;min-height:2.2em}
.status b{color:var(--pri2)}
.plateCard svg,.svgFull{width:100%;height:auto;display:block}
.plateCard{padding:12px}
.plateCard svg{max-width:560px;margin:0 auto}
#result{scroll-margin-top:170px}
.cells{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cellCard{margin:0}
.cellCard h3{font-size:18px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.cellCard svg{width:100%;height:auto;display:block;margin:4px 0 6px}
.sentence{background:#FBFAFF;border-radius:12px;padding:8px 10px;margin:6px 0}
.prow{display:flex;gap:6px;align-items:flex-start;padding:6px 8px;border-radius:10px;margin:3px 0;font-size:15px;border:1px solid transparent}
.prow .pl{font-weight:700;white-space:nowrap}
.prow.chg{background:var(--accSoft);border-color:#F1C95A}
.chgBadge{display:inline-block;background:var(--acc);color:#3A2900;font-size:12px;font-weight:800;border-radius:999px;padding:0 8px;margin-inline-start:4px;white-space:nowrap}
.changes{border-inline-start:6px solid var(--acc)}
.changes ul{margin:4px 0;padding-inline-start:20px}
.changes li{margin:4px 0}
.saved{background:var(--okBg);border:1px solid #9DD7B6;color:#0F4A2C;border-radius:12px;padding:8px 12px;font-size:15px}

/* animations */
@keyframes flip{0%{transform:scaleY(-1)}60%{transform:scaleY(1.08)}100%{transform:scaleY(1)}}
.anim .tetrad.flip{animation:flip .7s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%,100%{stroke-opacity:1}50%{stroke-opacity:.25}}
.anim .ring{animation:ring .5s ease-in-out 4}
@keyframes mvUp{from{transform:translateY(60px)}to{transform:none}}
@keyframes mvDown{from{transform:translateY(-60px)}to{transform:none}}
.mvUp{animation:mvUp 1.1s ease-out}.mvDown{animation:mvDown 1.1s ease-out}
@keyframes pop{0%{transform:scale(.94);opacity:.3}100%{transform:scale(1);opacity:1}}
.anim .cellCard,.anim .gam{animation:pop .45s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(255,179,0,.8)}100%{box-shadow:0 0 0 14px rgba(255,179,0,0)}}
.anim .prow.chg{animation:glow 1s ease-out 2}
.spot{outline:4px solid var(--acc);outline-offset:2px}
.chosen{outline:4px solid var(--ok);outline-offset:2px}

/* questions */
.q .qT{font-weight:700;font-size:18px;margin-bottom:10px}
.qHead{font-size:13px;font-weight:800;color:var(--pri);letter-spacing:.3px;margin-bottom:2px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:right;width:100%;min-height:52px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;font-size:16px;line-height:1.45}
.opt:hover:not([disabled]){border-color:#B7ADE6;background:#FBFAFF}
.optL{flex:none;width:28px;height:28px;border-radius:50%;background:var(--priSoft);color:var(--pri2);font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.opt.right{border-color:#4DB07E;background:var(--okBg)}
.opt.right .optL{background:#4DB07E;color:#fff}
.opt.wrongOpt{border-color:#E8A7A1;background:var(--badBg);opacity:.75;text-decoration:line-through;text-decoration-color:rgba(163,35,27,.5)}
.opt[disabled]{cursor:default}
.fb .good{background:var(--okBg);color:#0F4A2C;border-radius:12px;padding:10px 12px;margin-top:10px}
.fb .bad{background:var(--badBg);color:#6E1610;border-radius:12px;padding:10px 12px;margin-top:10px}
.hintRow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#F6F3FF;border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin:14px 0 -4px;font-weight:700;color:var(--pri2)}
.lock{background:#F6F3FF;border:1px dashed #B7ADE6;border-radius:14px;padding:12px;color:var(--muted);text-align:center}

/* mitosis */
.mitBtns{display:flex;gap:8px;flex-wrap:wrap}
.stageTitle{font-weight:800;font-size:20px;color:var(--pri2)}

/* gametes / child */
.gams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gam{margin:0}
.gam h3{font-size:17px}
.gam svg{width:100%;height:auto;display:block}
.persona{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.persona p{margin:0;font-size:15px;font-style:italic;color:#2E3350}
.persona.ghost .pav{opacity:.55;filter:saturate(.55)}
.kid.ghost .pav{opacity:.78;filter:saturate(.8)}
.kidsCard{border:2px solid #CFC6EE}
.kidsCard h3{font-size:20px}
.kids{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kid{text-align:center;font-size:14px;line-height:1.45;border-radius:12px;padding:6px 4px;border:1px solid transparent}
.kid .pav svg{width:100%;max-width:160px;height:auto;display:block;margin:0 auto}
.kid.kchg{background:var(--accSoft);border-color:#F1C95A}
.gam.faded{opacity:.5}
.field{display:block;margin:8px 0}
.field span{display:block;font-weight:700;font-size:15px;margin-bottom:3px}
.field input,.field textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:16px}
.field input:focus,.field textarea:focus{border-color:var(--pri);outline:none}
.traits{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.child{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:center}
.child svg{width:100%;max-width:220px;height:auto;margin:0 auto;display:block}
.report{white-space:pre-wrap;background:#FBFAFF;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px}
.err{color:var(--bad);font-weight:700;font-size:15px;min-height:1em}
.zyg{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* modal */
.modalBg{position:fixed;inset:0;background:rgba(20,16,50,.65);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:18px;max-width:900px;width:100%;max-height:92vh;overflow:auto;padding:14px}
.modal img{width:100%;height:auto;display:block;border-radius:10px}

.svgL{font-family:inherit;font-weight:700}
#printArea{display:none}

@media (max-width:700px){
  .mgrid{grid-template-columns:1fr}
  .prow{flex-direction:column;gap:2px}
  .mk{white-space:normal}
  body{font-size:16px}
  .hero h1{font-size:34px}
  .cells,.gams,.traits{grid-template-columns:1fr}
  .kids{grid-template-columns:1fr 1fr}
  .child{grid-template-columns:1fr}
  .card{padding:14px}
  .step{font-size:11px}
  .brand{font-size:15px}
  .simBtn{font-size:13.5px;min-height:56px;padding:4px 4px;border-radius:12px}
  .status{font-size:13.5px;padding:4px 8px;margin-top:6px}
  .sticky{padding-top:8px;padding-bottom:6px}
  #result{scroll-margin-top:150px}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;font-size:11.5pt}
  body>*{display:none!important}
  #printArea{display:block!important;direction:rtl}
  #printArea h1{font-size:22pt;color:#372C88}
  #printArea h2{font-size:15pt;color:#372C88;margin-top:14px;border-bottom:1.5px solid #ddd;padding-bottom:2px}
  #printArea table{border-collapse:collapse;width:100%;font-size:11pt}
  #printArea th,#printArea td{border:1px solid #bbb;padding:5px 7px;text-align:right}
  #printArea .num{text-align:center;direction:ltr;unicode-bidi:isolate}
  #printArea svg{max-width:105mm;height:auto;display:block;margin:0 auto}
  #printArea table{page-break-inside:avoid}
  #printArea .fig{page-break-inside:avoid;margin:8px 0}
  #printArea .foot{margin-top:18px;color:#555;font-size:10pt}
}
</style>
</head>

<main class="wrap" id="app" aria-live="off"></main>
<div id="modalRoot"></div>
<div id="printArea"></div>

const rnd2=()=>Math.random()<.5?0:1;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- הרצת מיוזה I ---------- */
function makeRun(mode){
  const orient = mode==='cross' ? [0,0,0,0] : [0,1,2,3].map(rnd2);
  const chr = [0,1,2].map(()=>({M:[['M','M'],['M','M']],P:[['P','P'],['P','P']]}));
  const events=[];
  if(mode!=='rand'){
    const n=Math.floor(Math.random()*4);                       // 0 עד 3 אירועים
    const all=[]; for(let k=0;k<3;k++)for(let l=0;l<2;l++)all.push({k,l});
    const pick=shuffle(all).slice(0,n).sort((a,b)=>a.k-b.k||a.l-b.l); // כל מקטע DNA לכל היותר פעם אחת בהרצה
    for(const {k,l} of pick){
      const mc=rnd2(), pc=rnd2();
      const t=chr[k].M[mc][l]; chr[k].M[mc][l]=chr[k].P[pc][l]; chr[k].P[pc][l]=t;
      events.push({k,l,mc,pc});
    }
  }
  const m2r=[0,1].map(()=>[0,1,2,3].map(rnd2));   // כיווני מיוזה II, נקבעים עם ההרצה
  return {mode,orient,chr,events,m2r,n:++S.runSeq};
}
function cellsOf(run){
  return [0,1].map(c=>({
    pairs:[0,1,2].map(k=>{const h=((run.orient[k]===0)===(c===0))?'M':'P';return {k,h,cts:run.chr[k][h]};}),
    sex:((run.orient[3]===0)===(c===0))?'X':'Y'
  }));
}
const cellKey=c=>c.pairs.map(p=>p.h+p.cts.map(x=>x.join('')).join('.')).join('|')+c.sex;
function diffRuns(a,b){
  if(!a)return null;
  const flipped=[0,1,2].filter(k=>a.orient[k]!==b.orient[k]);
  const sexFlip=a.orient[3]!==b.orient[3];
  const ca=cellsOf(a),cb=cellsOf(b),loci=new Set();
  for(let c=0;c<2;c++)for(let k=0;k<3;k++)for(let i=0;i<2;i++)for(let l=0;l<2;l++)
    if(ca[c].pairs[k].cts[i][l]!==cb[c].pairs[k].cts[i][l])loci.add(`${c}-${k}-${i}-${l}`);
  const cc=[0,1].map(c=>{let n=0;for(let k=0;k<3;k++)for(let l=0;l<2;l++)if([0,1].some(i=>loci.has(`${c}-${k}-${i}-${l}`)))n++;return n;});
  return {flipped,sexFlip,loci,cc,prevEvents:a.events.length,prevN:a.n,prevMode:a.mode};
}
function gametesOf(run,m2){
  const out=[];
  cellsOf(run).forEach((cell,c)=>[0,1].forEach(j=>out.push({
    from:c, sex:cell.sex,
    pairs:cell.pairs.map(p=>({k:p.k,h:p.h,loci:p.cts[j^m2.r[c][p.k]]}))
  })));
  return out;
}

/* ================= SVG ================= */
function chromatidV(x,y,w,h,origin,loci,hl){
  const c=COL[origin];
  let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${w/2}" fill="${c.body}" stroke="${c.stroke}" stroke-width="1.6"/>`;
  if(loci){
    const bh=Math.max(7,h*.13);
    [.2,.76].forEach((p,l)=>{
      const by=y+p*h;
      s+=`<rect x="${x+1.3}" y="${by-bh/2}" width="${w-2.6}" height="${bh}" fill="${COL[loci[l]].band}"/>`;
      if(hl&&hl[l])s+=`<rect class="ring" x="${x-3.5}" y="${by-bh/2-3.5}" width="${w+7}" height="${bh+7}" rx="5" fill="none" stroke="#FFB300" stroke-width="3.2"/>`;
    });
  }
  return s;
}
// כרומוזום משוכפל, ממורכז בצנטרומר
function dupChrom(h,w,origin,cts,o={}){
  const top=-.47*h;
  let s=chromatidV(-w-1,top,w,h,origin,cts&&cts[0],o.hl&&o.hl[0])+chromatidV(1,top,w,h,origin,cts&&cts[1],o.hl&&o.hl[1]);
  s+=`<ellipse cx="0" cy="0" rx="${w*.62}" ry="${w*.42}" fill="${COL[origin].stroke}"/>`;
  if(o.letter)s+=`<text x="0" y="${top+h+15}" text-anchor="middle" font-size="14" class="svgL" fill="${COL[origin].ink}">${o.letter}</text>`;
  return s;
}
function singleChrom(h,w,origin,loci,o={}){
  const top=-.47*h;
  let s=chromatidV(-w/2,top,w,h,origin,loci,o.hl);
  s+=`<ellipse cx="0" cy="0" rx="${w*.58}" ry="${w*.32}" fill="${COL[origin].stroke}"/>`;
  if(o.letter)s+=`<text x="0" y="${top+h+15}" text-anchor="middle" font-size="14" class="svgL" fill="${COL[origin].ink}">${o.letter}</text>`;
  return s;
}
const hOf=(k,o)=>k<3?HGT[k]:SEXH[o];
const sexLetter=o=>o==='M'?'X':'Y';

/* מטאפזה I: הזוגות על קו המשווה */
function plateSVG(run,d,label){
  const xs=[358,262,166,70], W=13;
  let s=`<svg viewBox="0 0 410 350" class="svgFull" role="img" aria-label="${esc(label)}">`;
  s+=`<ellipse cx="205" cy="175" rx="200" ry="168" fill="#FFFDF8" stroke="#A396D6" stroke-width="3"/>`;
  s+=`<circle cx="205" cy="34" r="6" fill="#8E7CC3"/><circle cx="205" cy="316" r="6" fill="#8E7CC3"/>`;
  xs.forEach(x=>{s+=`<line x1="205" y1="34" x2="${x}" y2="175" stroke="#D5CDEE" stroke-width="1.3"/><line x1="205" y1="316" x2="${x}" y2="175" stroke="#D5CDEE" stroke-width="1.3"/>`;});
  s+=`<line x1="18" y1="175" x2="392" y2="175" stroke="#8E7CC3" stroke-width="2" stroke-dasharray="7 6"/>`;
  s+=`<text x="205" y="22" text-anchor="middle" font-size="14" class="svgL" fill="#372C88">אל התא הראשון ↑</text>`;
  s+=`<text x="205" y="340" text-anchor="middle" font-size="14" class="svgL" fill="#372C88">אל התא השני ↓</text>`;
  for(let k=0;k<4;k++){
    const x=xs[k], up=run.orient[k]===0?'M':'P', lo=up==='M'?'P':'M';
    const flipped=d&&(k<3?d.flipped.includes(k):d.sexFlip);
    const hU=hOf(k,up), hL=hOf(k,lo);
    const cyU=167-.53*hU, cyL=183+.47*hL;
    const hl={M:[[0,0],[0,0]],P:[[0,0],[0,0]]};
    if(k<3)run.events.filter(e=>e.k===k).forEach(e=>{hl.M[e.mc][e.l]=1;hl.P[e.pc][e.l]=1;});
    s+=`<g class="tetrad${flipped&&animate?' flip':''}">`;
    [[up,cyU,hU],[lo,cyL,hL]].forEach(([o,cy,h])=>{
      s+=`<g transform="translate(${x},${cy})">${dupChrom(h,W,o,k<3?run.chr[k][o]:null,{hl:hl[o]})}</g>`;
      s+=`<text x="${x-20}" y="${cy+5}" text-anchor="start" font-size="${k<3?13:16}" class="svgL" fill="${COL[o].ink}">${k<3?COL[o].name:sexLetter(o)}</text>`;
    });
    s+=`</g>`;
    s+=`<text x="${x}" y="296" text-anchor="middle" font-size="13" class="svgL" fill="#4A5068">${k<3?'זוג '+(k+1):'XY'}</text>`;
    // קווי שחלוף
    if(k<3)run.events.filter(e=>e.k===k).forEach(e=>{
      const pos=(o,i)=>{const h=hOf(k,o),cy=(o===up?cyU:cyL);return {x:x+(i===0?-(W/2+1):(W/2+1)),y:cy-.47*h+[.2,.76][e.l]*h};};
      const a=pos('M',e.mc),b=pos('P',e.pc);
      const n=run.events.indexOf(e)+1, mx=x+30, my=(a.y+b.y)/2;
      s+=`<path d="M${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}" fill="none" stroke="#E69A00" stroke-width="2.4" stroke-dasharray="4 3"/>`;
      s+=`<circle cx="${mx-6}" cy="${my}" r="10" fill="#FFB300" stroke="#fff" stroke-width="2"/><text x="${mx-6}" y="${my+4.5}" text-anchor="middle" font-size="12" class="svgL" fill="#3A2900">${n}</text>`;
    });
  }
  return s+`</svg>`;
}

/* תא אחרי מיוזה I */
function cellSVG(cell,c,d,label){
  const xs=[206,152,98,48],W=12;
  let s=`<svg viewBox="0 0 256 150" role="img" aria-label="${esc(label)}"><ellipse cx="128" cy="72" rx="122" ry="66" fill="#FFFDF8" stroke="#A396D6" stroke-width="3"/>`;
  cell.pairs.forEach(p=>{
    const h=HGT[p.k]*.82, hl=[[0,0],[0,0]];
    if(d&&!d.flipped.includes(p.k))for(let i=0;i<2;i++)for(let l=0;l<2;l++)if(d.loci.has(`${c}-${p.k}-${i}-${l}`))hl[i][l]=1;
    if(d&&d.flipped.includes(p.k))s+=`<rect class="ring" x="${xs[p.k]-22}" y="${66-.47*h-8}" width="44" height="${h+16}" rx="10" fill="none" stroke="#FFB300" stroke-width="3" stroke-dasharray="5 4"/>`;
    s+=`<g transform="translate(${xs[p.k]},66)">${dupChrom(h,W,p.h,p.cts,{hl})}</g><text x="${xs[p.k]}" y="${66+.53*h+17}" text-anchor="middle" font-size="12" fill="#4A5068">זוג ${p.k+1}</text>`;
  });
  const so=cell.sex==='X'?'M':'P', h=SEXH[so]*.82;
  if(d&&d.sexFlip)s+=`<rect class="ring" x="${xs[3]-22}" y="${66-.47*h-8}" width="44" height="${h+16}" rx="10" fill="none" stroke="#FFB300" stroke-width="3" stroke-dasharray="5 4"/>`;
  s+=`<g transform="translate(${xs[3]},66)">${dupChrom(h,W,so,null,{})}</g><text x="${xs[3]}" y="${66+.53*h+17}" text-anchor="middle" font-size="13" class="svgL" fill="${COL[so].ink}">${cell.sex}</text>`;
  return s+`</svg>`;
}

/* תא מין */
function gameteSVG(g,label){
  const xs=[214,174,134,96],W=12;
  let s=`<svg viewBox="0 0 260 130" role="img" aria-label="${esc(label)}">`;
  s+=`<path d="M58 66 C 46 44, 36 88, 26 66 S 10 44, 2 62" fill="none" stroke="#8E7CC3" stroke-width="4" stroke-linecap="round"/>`;
  s+=`<ellipse cx="152" cy="65" rx="96" ry="56" fill="#FFFDF8" stroke="#A396D6" stroke-width="3"/>`;
  g.pairs.forEach(p=>{const h=HGT[p.k]*.72;s+=`<g transform="translate(${xs[p.k]},60)">${singleChrom(h,W,p.h,p.loci)}</g>`;});
  const so=g.sex==='X'?'M':'P';
  s+=`<g transform="translate(${xs[3]},60)">${singleChrom(SEXH[so]*.72,W,so,null,{letter:g.sex})}</g>`;
  return s+`</svg>`;
}

/* מיטוזה */
const MIT_POS=[
  {k:0,o:'M',x:92,y:92,r:-18},{k:2,o:'P',x:150,y:150,r:14},{k:1,o:'M',x:205,y:84,r:8},{k:3,o:'P',x:262,y:156,r:-12},
  {k:0,o:'P',x:310,y:96,r:22},{k:1,o:'P',x:112,y:160,r:-28},{k:3,o:'M',x:200,y:150,r:30},{k:2,o:'M',x:268,y:88,r:-6}];
function chromAny(p,dup,sc){
  const h=hOf(p.k,p.o)*sc, loci=p.k<3?[p.o,p.o]:null, letter=p.k===3?sexLetter(p.o):'';
  return dup?dupChrom(h,12,p.o,p.k<3?[loci,loci]:null,{letter}):singleChrom(h,12,p.o,loci,{letter});
}
function mitosisSVG(step,label){
  let s=`<svg viewBox="0 0 410 250" class="svgFull" role="img" aria-label="${esc(label)}">`;
  if(step<=1){
    s+=`<ellipse cx="205" cy="125" rx="196" ry="114" fill="#FFFDF8" stroke="#A396D6" stroke-width="3"/>`;
    MIT_POS.forEach(p=>{s+=`<g transform="translate(${p.x+5},${p.y+2}) rotate(${p.r})">${chromAny(p,step===1,.74)}</g>`;});
  }else{
    const order=[0,4,2,7,5,1,6,3], X=i=>46+i*45, SC=.55;
    const loc=p=>p.k<3?[p.o,p.o]:null;
    if(step<=3){
      s+=`<ellipse cx="205" cy="125" rx="196" ry="${step===3?118:114}" fill="#FFFDF8" stroke="#A396D6" stroke-width="3"/>`;
      s+=`<circle cx="205" cy="16" r="6" fill="#8E7CC3"/><circle cx="205" cy="234" r="6" fill="#8E7CC3"/>`;
      s+=`<line x1="22" y1="125" x2="388" y2="125" stroke="#8E7CC3" stroke-width="2" stroke-dasharray="7 6"/>`;
    }
    if(step===2){
      order.forEach((idx,i)=>{s+=`<line x1="205" y1="16" x2="${X(i)}" y2="125" stroke="#D5CDEE"/><line x1="205" y1="234" x2="${X(i)}" y2="125" stroke="#D5CDEE"/>`;});
      order.forEach((idx,i)=>{const p=MIT_POS[idx];s+=`<g transform="translate(${X(i)},125) rotate(90) scale(${SC})">${dupChrom(hOf(p.k,p.o),12,p.o,p.k<3?[loc(p),loc(p)]:null,{})}</g>`;
        if(p.k===3)s+=`<text x="${X(i)}" y="105" text-anchor="middle" font-size="13" class="svgL" fill="${COL[p.o].ink}">${sexLetter(p.o)}</text>`;});
    }else if(step===3){
      const yU=62,yD=188;
      order.forEach((idx,i)=>{s+=`<line x1="205" y1="16" x2="${X(i)}" y2="${yU}" stroke="#C9BFEA" stroke-width="1.4"/><line x1="205" y1="234" x2="${X(i)}" y2="${yD}" stroke="#C9BFEA" stroke-width="1.4"/>`;});
      s+=`<path d="M392 108 v-34 m-6 8 l6 -8 l6 8" stroke="#8E7CC3" stroke-width="2.5" fill="none"/><path d="M392 142 v34 m-6 -8 l6 8 l6 -8" stroke="#8E7CC3" stroke-width="2.5" fill="none"/>`;
      ['mvUp','mvDown'].forEach((cls,j)=>{
        s+=`<g class="${animate?cls:''}">`;
        order.forEach((idx,i)=>{const p=MIT_POS[idx];s+=`<g transform="translate(${X(i)},${j?yD:yU}) rotate(90) scale(${SC})">${singleChrom(hOf(p.k,p.o),12,p.o,loc(p),{})}</g>`;
          if(p.k===3)s+=`<text x="${X(i)}" y="${j?yD+24:yU-14}" text-anchor="middle" font-size="13" class="svgL" fill="${COL[p.o].ink}">${sexLetter(p.o)}</text>`;});
        s+=`</g>`;
      });
    }else{
      [62,188].forEach((cy,j)=>{
        s+=`<ellipse cx="205" cy="${cy}" rx="196" ry="58" fill="#FFFDF8" stroke="#A396D6" stroke-width="3"/>`;
        order.forEach((idx,i)=>{const p=MIT_POS[idx];s+=`<g transform="translate(${X(i)},${cy}) rotate(90) scale(${SC})">${singleChrom(hOf(p.k,p.o),12,p.o,loc(p),{})}</g>`;
          if(p.k===3)s+=`<text x="${X(i)}" y="${cy-14}" text-anchor="middle" font-size="13" class="svgL" fill="${COL[p.o].ink}">${sexLetter(p.o)}</text>`;});
      });
    }
  }
  return s+`</svg>`;
}

  const rEye=mood==='wink'?`<path d="M58 42 q6 -6 12 0" stroke="#2A3B33" stroke-width="4" fill="none" stroke-linecap="round"/>`:`<circle cx="64" cy="42" r="8" fill="#fff" stroke="#2A3B33" stroke-width="2"/><circle cx="62" cy="43" r="4" fill="#2A3B33"/>`;

const mascot=(mood,text)=>`<div class="mascot">${mascotSVG(mood)}<div class="bubble">${text}</div></div>`;

/* דמות הילד/ה */
function childSVG(ch){
  const tall=ch.height==='M', full=ch.build==='M', girl=ch.girl;
  const eye=ch.eyes==='M'?'#2F7FD8':'#7A4A22', hair=ch.hair==='M'?'#24222B':'#E0612A';
  const groundY=232, legH=tall?62:42, bodyH=tall?70:56, bw=full?78:50, headR=31;
  const bodyTop=groundY-legH-bodyH, headCy=bodyTop-headR+6;
  let s=`<svg viewBox="0 0 200 245" role="img" aria-label="${esc(ch.alt)}">`;
  s+=`<ellipse cx="100" cy="${groundY+4}" rx="62" ry="7" fill="#E9E1F6"/>`;
  if(ch.draw){s+=`<g transform="translate(150,${groundY-38})"><ellipse cx="0" cy="0" rx="26" ry="19" fill="#FFE8B8" stroke="#B88A2C" stroke-width="2"/><circle cx="-11" cy="-5" r="4" fill="#D6246E"/><circle cx="0" cy="-9" r="4" fill="#1690D6"/><circle cx="11" cy="-4" r="4" fill="#2A8F60"/><circle cx="3" cy="7" r="5" fill="#fff" stroke="#B88A2C"/></g>`;}
  // רגליים
  s+=`<rect x="${100-bw/4-9}" y="${groundY-legH}" width="16" height="${legH}" rx="7" fill="#4A3DA6"/><rect x="${100+bw/4-7}" y="${groundY-legH}" width="16" height="${legH}" rx="7" fill="#4A3DA6"/>`;
  // גוף
  s+=`<rect x="${100-bw/2}" y="${bodyTop}" width="${bw}" height="${bodyH+8}" rx="${Math.min(26,bw/2)}" fill="${girl?'#FFB300':'#2A8F60'}"/>`;
  // ידיים
  s+=`<path d="M${100-bw/2+4} ${bodyTop+16} q-20 18 -14 42" stroke="#F2C6A0" stroke-width="11" fill="none" stroke-linecap="round"/>`;
  s+=`<path d="M${100+bw/2-4} ${bodyTop+16} q20 18 14 42" stroke="#F2C6A0" stroke-width="11" fill="none" stroke-linecap="round"/>`;
  if(ch.draw){const hx=100+bw/2+10,hy=bodyTop+58;s+=`<line x1="${hx}" y1="${hy}" x2="${hx+18}" y2="${hy-26}" stroke="#7A4A22" stroke-width="5" stroke-linecap="round"/><path d="M${hx+18} ${hy-26} l5 -9 l3 3 z" fill="#D6246E" stroke="#D6246E" stroke-width="3" stroke-linejoin="round"/>`;}
  // ראש ושיער
  if(girl)s+=`<circle cx="${100-headR-4}" cy="${headCy+8}" r="11" fill="${hair}"/><circle cx="${100+headR+4}" cy="${headCy+8}" r="11" fill="${hair}"/>`;
  s+=`<circle cx="100" cy="${headCy}" r="${headR}" fill="#F7D3B2" stroke="#D8A47C" stroke-width="2"/>`;
  s+=`<path d="M${100-headR} ${headCy-2} C ${100-headR} ${headCy-headR-10}, ${100+headR} ${headCy-headR-10}, ${100+headR} ${headCy-2} C ${100+headR-8} ${headCy-18}, ${100-headR+8} ${headCy-20}, ${100-headR} ${headCy-2}Z" fill="${hair}"/>`;
  [-12,12].forEach(dx=>{s+=`<circle cx="${100+dx}" cy="${headCy+2}" r="6.5" fill="#fff"/><circle cx="${100+dx}" cy="${headCy+3}" r="4.3" fill="${eye}"/><circle cx="${100+dx-1}" cy="${headCy+1.5}" r="1.5" fill="#fff"/>`;});
  s+=`<path d="M90 ${headCy+15} q10 9 20 0" stroke="#7A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if(ch.music){
    s+=`<path d="M${100-headR-3} ${headCy+4} C ${100-headR-3} ${headCy-headR-16}, ${100+headR+3} ${headCy-headR-16}, ${100+headR+3} ${headCy+4}" stroke="#372C88" stroke-width="5" fill="none"/>`;
    s+=`<rect x="${100-headR-10}" y="${headCy-6}" width="12" height="20" rx="5" fill="#372C88"/><rect x="${100+headR-2}" y="${headCy-6}" width="12" height="20" rx="5" fill="#372C88"/>`;
    s+=`<g fill="#372C88"><ellipse cx="34" cy="${headCy-26}" rx="6" ry="4.5"/><rect x="38.5" y="${headCy-48}" width="2.5" height="22"/><ellipse cx="22" cy="${headCy-6}" rx="5" ry="4"/><rect x="25.5" y="${headCy-24}" width="2.3" height="18"/></g>`;
  }
  return s+`</svg>`;
}

function locusList(k,loci){return loci.map((o,l)=>mkSpan(k,l,o)).join(', ');}
function cellSentence(cell,c){
  const parts=[];
  for(let k=0;k<3;k++)for(let l=0;l<2;l++){
    const a=cell.pairs[k].cts[0][l],b=cell.pairs[k].cts[1][l];
    parts.push(a===b?mk(k,l,a):`${mk(k,l,a)} או ${mk(k,l,b)} (בכרומטידות (עותקים) שונות)`);
  }
  return `בתא ${ORD[c]} נמצאים מקטעי ה־DNA: ${parts.join(', ')}, וכרומוזום ${cell.sex}.`;
}
function pairRow(p,c,d){
  const chg=d&&(d.flipped.includes(p.k)||[0,1].some(i=>[0,1].some(l=>d.loci.has(`${c}-${p.k}-${i}-${l}`))));
  const same=p.cts[0].join()===p.cts[1].join();
  const body=same?`שתי הכרומטידות (עותקים): ${locusList(p.k,p.cts[0])}`:
    `כרומטידה (עותק) 1: ${locusList(p.k,p.cts[0])}<br>כרומטידה (עותק) 2: ${locusList(p.k,p.cts[1])}`;
  return `<div class="prow${chg?' chg':''}"><div class="pl">זוג ${p.k+1} ${tag(p.h)}</div><div>${body}${chg?'<span class="chgBadge">השתנה</span>':''}</div></div>`;
}
function cellCard(cell,c,d){
  const sexChg=d&&d.sexFlip, so=cell.sex==='X'?'M':'P';
  return `<div class="card cellCard"><h3><span>התא ${ORD[c]}</span><span class="badge">4 כרומוזומים · 8 כרומטידות (עותקים)</span></h3>
  ${cellSVG(cell,c,d,`התא ${ORD[c]} אחרי מיוזה I`)}
  <div class="sentence">${cellSentence(cell,c)}</div>
  ${cell.pairs.map(p=>pairRow(p,c,d)).join('')}
  <div class="prow${sexChg?' chg':''}"><div class="pl">כרומוזום מין</div><div>${cell.sex} ${tag(so)}${sexChg?'<span class="chgBadge">השתנה</span>':''}</div></div>
  <p class="small muted" style="margin:6px 0 0">אין בתא אף זוג של כרומוזומים מאותו סוג: מכל זוג הגיע כרומוזום אחד בלבד.</p></div>`;
}
function eventText(run,e,i){
  const a=mk(e.k,e.l,'M'),b=mk(e.k,e.l,'P');
  return `שחלוף ${i+1}: בזוג ${e.k+1}, במקטע ה־DNA של ${PAIRS[e.k].loci[e.l].name}. ${mkSpan(e.k,e.l,'M')} עבר מכרומטידה (עותק) ${e.mc+1} של ההומולוג האימהי לכרומטידה (עותק) ${e.pc+1} של ההומולוג האבהי, ו${mkSpan(e.k,e.l,'P')} עבר בכיוון ההפוך.`;
}
function changesHTML(run,d){
  const li=[];
  if(!d)li.push('זו ההרצה הראשונה. בהרצה הבאה תראו כאן מה השתנה לעומתה.');
  else{
    if(run.mode==='cross'&&d.prevMode==='cross')li.push('במצב "שחלוף בלבד" כיווני הזוגות קבועים, כדי לראות רק את השפעת השחלוף.');
    d.flipped.forEach(k=>{const h=run.orient[k]===0?'M':'P';li.push(`זוג ${k+1} התהפך: עכשיו ההומולוג ה${COL[h].name} הגיע לתא הראשון.`);});
    if(d.sexFlip)li.push(`כרומוזומי המין התהפכו: עכשיו ${run.orient[3]===0?'X':'Y'} בתא הראשון.`);
    if(!d.flipped.length&&!d.sexFlip&&run.mode!=='cross'&&!(d.prevMode==='cross'))li.push('כיווני כל הזוגות יצאו זהים להרצה הקודמת. גם זה יכול לקרות בהגרלה.');
    if(!d.flipped.length&&!d.sexFlip&&run.mode==='cross'&&d.prevMode!=='cross')li.push('כיווני הזוגות חזרו לסידור הקבוע של מצב "שחלוף בלבד".');
  }
  if(run.mode!=='rand'){
    li.push(`<b>מספר השחלופים בהרצה: ${run.events.length}</b>${d?` (בהרצה הקודמת: ${d.prevEvents})`:''}`);
    if(!run.events.length)li.push('<b>לא התרחש שחלוף בהרצה זו.</b> אפשר להריץ שוב.');
    run.events.forEach((e,i)=>li.push(eventText(run,e,i)));
  }else li.push('במצב זה אין שחלוף: הכרומטידות (עותקים) של כל כרומוזום נשארות זהות.');
  if(d)li.push(d.loci.size?`לעומת ההרצה הקודמת השתנו ${d.cc[0]} מתוך 6 מקטעי DNA בתא הראשון ו־${d.cc[1]} בתא השני. השינויים מסומנים בצהוב בתרשים ובתיאור.`:'מקטעי ה־DNA בשני התאים זהים לאלה של ההרצה הקודמת.');
  return `<div class="card changes"><h3>מה קרה בהרצה ${run.n}${d?' ומה השתנה':''}</h3><ul>${li.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
}
function statusLine(){
  const r=S.last; if(!r)return 'לחצו על כפתור כדי להריץ את מיוזה I. התוצאה תופיע מיד מתחת.';
  const d=S.lastDiff;
  let t=`<b>הרצה ${r.n} · ${MODES[r.mode]}:</b> `;
  const bits=[];
  if(d){const f=d.flipped.length+(d.sexFlip?1:0);if(r.mode!=='cross'||d.prevMode!=='cross')bits.push(f>1?`${f} זוגות התהפכו`:f===1?'זוג אחד התהפך':'אף זוג לא התהפך');}
  if(r.mode!=='rand')bits.push(r.events.length>1?`${r.events.length} אירועי שחלוף`:r.events.length?'אירוע שחלוף אחד':'לא התרחש שחלוף');
  if(d)bits.push(d.loci.size?`מקטעי DNA שהשתנו: ${d.cc[0]} בתא הראשון, ${d.cc[1]} בשני`:'מקטעי ה־DNA לא השתנו');
  return t+(bits.join(' · ')||'התוצאה מוצגת למטה');
}

function childData(g,withMom=true){
  const v=(k,l)=>g.pairs[k].loci[l];
  const girl=g.sex==='X', G=(m,f)=>girl?f:m;
  const ch={girl,eyes:v(0,0),hair:v(0,1),music:v(1,0)==='M',draw:v(1,1)==='P',height:v(2,0),build:v(2,1)};
  const tall=ch.height==='M'?G('גבוה','גבוהה'):G('נמוך','נמוכה');
  const eh=`${mk(0,0,ch.eyes)} ו${mk(0,1,ch.hair)}`;
  const look=ch.build==='P'?`${G('ילד','ילדה')} ${tall} ורזה, עם ${eh}`:`${G('ילד','ילדה')} ${tall} עם מבנה גוף מלא, ${eh}`;
  const talent=ch.music&&ch.draw?`אני ${G('אוהב','אוהבת')} מוזיקה וגם לצייר, אז כנראה תמצאו אותי ${G('מצייר','מציירת')} עם אוזניות על הראש.`
    :ch.music?`יש לי אהבה גדולה למוזיקה, ואני ${G('מזמזם','מזמזמת')} כמעט כל הזמן. ציור, לעומת זאת, ממש לא הצד החזק שלי: כשאני ${G('מצייר','מציירת')} חתול, הוא יוצא דומה לתפוח אדמה.`
    :ch.draw?`מוזיקה פחות מדברת אליי, אבל תנו לי דף ועיפרון ואני ${G('נעלם','נעלמת')} לשעות.`
    :`לא מוזיקה ולא ציור. אני עוד ${G('מחפש','מחפשת')} את הכישרון שלי, ואני ${G('בטוח','בטוחה')} שהוא מחכה לי איפשהו.`;
  const row=ch.height==='M'?'בתמונת המחזור תמיד ישימו אותי בשורה האחורית.':'בתמונת המחזור תמיד ישימו אותי בשורה הראשונה.';
  const mom=S.mother.map(m=>m.trim()).filter(Boolean).map(m=>`"${m}"`);
  const momTxt=withMom&&mom.length?` ומאמא קיבלתי עוד ${mom.length===4?'ארבע ':''}תכונות: ${mom.length>1?mom.slice(0,-1).join(', ')+' ו־':''}${mom[mom.length-1]}.`:'';
  ch.short=`אני כנראה אהיה ${look}. ${talent}`;
  ch.descPlain=`${ch.short} ${row}${momTxt}`;
  ch.desc=esc(ch.descPlain);
  ch.alt=`${G('ילד','ילדה')} ${tall} עם ${eh}`;
  return ch;
}

/* ================= אירועים ================= */
function scrollToResult(){const el=document.getElementById('result');if(!el)return;const st=document.querySelector('.sticky');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const top=el.getBoundingClientRect().top+window.scrollY-(st?st.offsetHeight:0)-6;window.scrollTo({top,behavior:reduce?'auto':'smooth'});}
function doRun(mode){
  const r=makeRun(mode);
  S.prev=S.last; S.lastDiff=diffRuns(S.last,r); S.last=r; S.counts[mode]++;
  cellsOf(r).forEach(c=>S.seen[mode].push(cellKey(c)));
  if(mode==='combo')S.savedCombo=r;
  animate=true; render(true); animate=false;
  scrollToResult();
}
function openHint(stage){
  const items=HINTS[stage]||[];
  document.getElementById('modalRoot').innerHTML=`<div class="modalBg" data-act="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-label="רמז"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b>רמז</b><button class="btn" data-act="closeModal" id="closeHint">סגירה</button></div>${items.map(h=>`<figure style="margin:0 0 12px"><img src="${esc(h.src)}" alt="${esc(h.caption||'איור רמז')}"><figcaption class="small muted">${esc(h.caption||'')}</figcaption></figure>`).join('')}</div></div>`;
  document.getElementById('closeHint').focus();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modalRoot').innerHTML='';});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const act=b.dataset.act;
  if(act==='closeModal'){if(e.target===b||b.tagName==='BUTTON')document.getElementById('modalRoot').innerHTML='';return;}
  if(act==='start'){if(!S.creator.trim()){document.getElementById('serr').textContent='כתבו את השם שלכם כדי להתחיל.';document.getElementById('creatorIn').focus();return;}
    S.started=true;S.maxScreen=Math.max(1,S.maxScreen||0);S.screen=S.maxScreen;render();window.scrollTo(0,0);return;}
  if(act==='reset'){try{localStorage.removeItem(KEY);}catch(_){}S=fresh();render();return;}
  if(act==='next'){S.screen++;S.maxScreen=Math.max(S.maxScreen||0,S.screen);S.lastWrong=null;render();window.scrollTo(0,0);return;}
  if(act==='go'){S.screen=+b.dataset.i;S.lastWrong=null;render();window.scrollTo(0,0);return;}
  if(act==='back'){S.screen--;S.lastWrong=null;render();window.scrollTo(0,0);return;}
  if(act==='mit'){S.mitStep=(S.mitStep+1)%5;S.mitReached=Math.max(S.mitReached||0,S.mitStep);animate=true;render(true);animate=false;return;}
  if(act==='mitBack'){S.mitStep=Math.max(0,S.mitStep-1);render(true);return;}
  if(act==='run'){doRun(b.dataset.mode);return;}
  if(act==='ans'){const id=b.dataset.q,o=+b.dataset.o;
    if(Q[id].options[o].c){S.answered[id]=true;S.lastWrong=null;}else{(S.wrong[id]=S.wrong[id]||[]).push(o);S.lastWrong={q:id,o};}
    render(true);const fb=document.querySelector(`#q-${id} .fb`);if(fb&&fb.getBoundingClientRect().bottom>innerHeight)fb.scrollIntoView({block:'nearest'});return;}
  if(act==='m2'){S.m2Shown=true;animate=true;render(true);animate=false;const g=document.getElementById('gam-0');if(g)g.scrollIntoView({block:'start',behavior:'smooth'});return;}
  if(act==='fert'){
    if(S.mother.some(m=>!m.trim())){document.getElementById('ferr').textContent='כתבו את כל ארבע התכונות מהאם לפני ההפריה.';return;}
    const pick=Math.floor(Math.random()*4);
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    b.disabled=true;
    const finish=()=>{S.chosen=pick;render(true);const z=document.querySelector('.child');if(z)z.closest('.card').previousElementSibling.scrollIntoView({block:'start',behavior:reduce?'auto':'smooth'});};
    if(reduce){finish();return;}
    document.getElementById('gams').scrollIntoView({block:'start',behavior:'smooth'});
    let i=0;const steps=10+pick;const tick=()=>{document.querySelectorAll('.gam').forEach((el,j)=>el.classList.toggle('spot',j===i%4));i++;if(i<=steps)setTimeout(tick,140);else setTimeout(finish,350);};tick();
    return;}
  if(act==='report'){
    const miss=[];if(!S.childName.trim())miss.push('שם לילד/ה');if(!S.reflection.trim())miss.push('משפט רפלקציה');
    if(miss.length){document.getElementById('rerr').textContent='חסר: '+miss.join(', ')+'.';return;}
    S.reportShown=true;render(true);document.getElementById('reportCard').scrollIntoView({block:'start',behavior:'smooth'});return;}
  if(act==='copy'){const t=reportText();const msg=document.getElementById('copyMsg');
    const fallback=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}ta.remove();msg.textContent=ok?'הדוח הועתק.':'לא הצלחנו להעתיק. סמנו את הטקסט והעתיקו ידנית.';};
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>msg.textContent='הדוח הועתק.',fallback);else fallback();return;}
  if(act==='pdf'){document.getElementById('printArea').innerHTML=summaryHTML();window.print();return;}
  if(act==='hint'){openHint(b.dataset.stage);return;}
});
document.addEventListener('input',e=>{
  const f=e.target.dataset.field;if(!f)return;
  if(f==='mother')S.mother[+e.target.dataset.i]=e.target.value;else S[f]=e.target.value;
  if(S.reportShown&&f!=='mother'){const r=document.querySelector('.report');if(r)r.textContent=reportText();const w=document.getElementById('waLink');if(w)w.href=waHref();}
  save();
});
render();
</script>
</body>
